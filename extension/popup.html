<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <div class="header">
      <div class="logo">S</div>

      <div>
        <h1>Spendwall</h1>
        <p>Your spending firewall</p>
      </div>
    </div>

    <div class="status">
      <span class="dot"></span>
      Protection active
    </div>

    <div class="divider"></div>

    <p class="label">ACTIVE RULES</p>

    <div class="rule">
      <span>Block subscriptions</span>
      <span class="check">✓</span>
    </div>

    <div class="rule">
      <span>Approval over $100</span>
      <span class="check">✓</span>
    </div>

    <div class="rule">
      <span>Shipping ≤ $10</span>
      <span class="check">✓</span>
    </div>

    <div class="rule">
      <span>Refundable only</span>
      <span class="check">✓</span>
    </div>

    <button id="openSpendwall">Open Spendwall</button>

    <script src="popup.js"></script>
  </body>
</html>
