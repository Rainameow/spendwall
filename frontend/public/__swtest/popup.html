<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Spendwall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <header class="header">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
            <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
          </svg>
        </span>
        <div>
          <h1>spendwall<span>.</span></h1>
          <p>Your spending firewall</p>
        </div>
      </div>
    </header>

    <div class="status" role="status">
      <span class="dot" aria-hidden="true"></span>
      <span>
        <strong>Protection active</strong>
        Checkouts are checked before you pay
      </span>
    </div>

    <section class="rules" aria-labelledby="rules-label">
      <div class="rules-head">
        <p id="rules-label" class="label">Active rules</p>
        <span class="count">4 on</span>
      </div>

      <ul>
        <li class="rule">
          <span class="rule-tag tag-coral" aria-hidden="true">01</span>
          <span class="rule-name">Block subscriptions</span>
          <span class="check" aria-label="Enabled">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
          </span>
        </li>

        <li class="rule">
          <span class="rule-tag tag-sun" aria-hidden="true">02</span>
          <span class="rule-name">Approval over $100</span>
          <span class="check" aria-label="Enabled">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
          </span>
        </li>

        <li class="rule">
          <span class="rule-tag tag-lime" aria-hidden="true">03</span>
          <span class="rule-name">Shipping &le; $10</span>
          <span class="check" aria-label="Enabled">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
          </span>
        </li>

        <li class="rule">
          <span class="rule-tag tag-paper" aria-hidden="true">04</span>
          <span class="rule-name">Refundable only</span>
          <span class="check" aria-label="Enabled">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
          </span>
        </li>
      </ul>
    </section>

    <div class="legend" aria-label="Decision types">
      <span class="chip chip-lime">Allow</span>
      <span class="chip chip-sun">Warn</span>
      <span class="chip chip-coral">Block</span>
    </div>

    <button id="openSpendwall" type="button">
      Open Spendwall
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>
    </button>

    <script src="popup.js"></script>
  </body>
</html>
